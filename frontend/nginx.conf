# SPA-only static file server for ksccc-frontend. This container's sole
# responsibility is serving the built React/Vite bundle — it does not proxy
# or route anything. The shared Nginx gateway (quintessence-infrastructure)
# is responsible for routing /api to ksccc-api and / to this container.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite's hashed asset filenames make long-lived caching safe — a new
    # build produces new filenames, so stale cached assets are never served
    # under a changed route.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: there is no client-side router (App.jsx reads
    # window.location.pathname directly), so every route — including a
    # direct browser refresh/deep link to e.g. /public/climate-atlas — must
    # resolve to index.html. index.html itself must never be cached, or
    # visitors could be stuck on a stale build after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
