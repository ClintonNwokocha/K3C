name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Conservative default — only the build-and-push job below needs write
# access (to GHCR packages), and only grants itself that explicitly.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: ci_test_db
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d ci_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-throwaway-secret-key-not-for-production
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      REST_THROTTLE_ANON_RATE: "100000/hour"
      REST_THROTTLE_USER_RATE: "100000/hour"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: ci_test_db
      DATABASE_USER: ci_test_user
      DATABASE_PASSWORD: ci_test_password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Django test suite
        working-directory: backend
        run: python manage.py test

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Builds and pushes ksccc-api / ksccc-frontend images to GHCR. Only runs
  # on a direct push to main or develop (never for pull_request — a PR run
  # never has packages:write and this job's own `if` excludes PR events
  # entirely), and only after both test jobs above succeed. Does not deploy
  # anywhere — the shared quintessence-infrastructure platform is
  # responsible for pulling and running these images later.
  build-and-push:
    name: Build & push (${{ matrix.image }})
    needs: [backend, frontend]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: api
            context: ./backend
            image: ksccc-api
          - component: frontend
            context: ./frontend
            image: ksccc-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "moving_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving_tag=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:${{ steps.vars.outputs.moving_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
