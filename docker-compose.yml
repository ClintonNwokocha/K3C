services:
  db:
    image: postgis/postgis:16-3.5
    container_name: ksccc_postgis
    environment:
      POSTGRES_DB: ksccc_db
      POSTGRES_USER: ksccc_user
      POSTGRES_PASSWORD: REDACTED
    ports:
      - "5432:5432"
    volumes:
      - ksccc_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ksccc_redis
    ports:
      - "6379:6379"

volumes:
  ksccc_postgres_data:
