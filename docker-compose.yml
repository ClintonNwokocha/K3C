services:
  db:
    image: postgis/postgis:16-3.5
    container_name: ksccc_postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ksccc_db}
      POSTGRES_USER: ${POSTGRES_USER:-ksccc_user}
      # No default here on purpose — set POSTGRES_PASSWORD in a root-level
      # .env file (gitignored, see .env.example) before running
      # `docker compose up`. Docker Compose auto-loads a .env file placed
      # next to this docker-compose.yml.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a local .env file, see .env.example}
    ports:
      - "5432:5432"
    volumes:
      - ksccc_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ksccc_redis
    ports:
      - "6379:6379"

volumes:
  ksccc_postgres_data:
